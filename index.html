<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Манка — био</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --ink: #14213d;
    --muted: #55607a;
    --accent: #2a6f97;
    --line: #cdd5df;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1724;
      --ink: #e8edf5;
      --muted: #9aa6bd;
      --accent: #6fb1d8;
      --line: #26334a;
      --card: #162036;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    line-height: 1.65;
  }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  header { padding: 72px 0 40px; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font: 700 40px "Fraunces", serif;
    margin-bottom: 28px;
    object-fit: cover; display: block;
  }
  h1 {
    font-family: "Fraunces", serif;
    font-size: clamp(2.4rem, 8vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .tagline { margin-top: 14px; font-size: 1.15rem; color: var(--muted); max-width: 52ch; }

  nav { margin-top: 28px; display: flex; gap: 20px; flex-wrap: wrap; }
  nav a { text-decoration: none; font-weight: 500; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  nav a:hover { border-color: var(--accent); }

  section { padding: 40px 0; border-top: 1px solid var(--line); }
  h2 { font-family: "Fraunces", serif; font-size: 1.6rem; margin-bottom: 18px; }
  p + p { margin-top: 14px; }

  .timeline { list-style: none; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 12px 0; }
  .timeline .year { color: var(--muted); font-variant-numeric: tabular-nums; }
  .timeline strong { display: block; }
  .timeline span { color: var(--muted); }

  .skills { display: flex; flex-wrap: wrap; gap: 10px; padding: 0; list-style: none; }
  .skills li {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 16px; font-size: 0.95rem;
  }

  .contacts { display: grid; gap: 10px; }

  footer { padding: 32px 0 56px; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--line); }

  @media (max-width: 520px) {
    .timeline li { grid-template-columns: 1fr; gap: 2px; }
  }

  /* Фон-фотография */

    --bg: #0f1724; --ink: #f1f4f9; --muted: #b4bfd3;
